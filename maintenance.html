<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Focus - Off-line for maintenance</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:Arial,Helvetica,sans-serif;background:#003057;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
  .box{max-width:460px;padding:32px 28px}
  .bar{height:4px;width:64px;background:#FA0A11;margin:0 auto 24px}
  h1{font-size:26px;margin:0 0 12px}
  p{font-size:15px;line-height:1.5;margin:0;color:#C3B091}
</style>
</head>
<body>
  <div class="box">
    <div class="bar"></div>
    <h1>Off-line for maintenance</h1>
    <p>Focus is temporarily unavailable. Please try again shortly.</p>
  </div>
</body>
</html>
