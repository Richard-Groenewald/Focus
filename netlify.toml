[build]
  # build.js (v7.9.36) publishes dist/: index.html with its inline script minified
  # by esbuild, stamped with branch + commit so prod/test/dev are distinguishable
  # in-app (placeholders fall back to 'local' when unset), plus version.txt (the
  # FOCUS vX.Y.Z from index.html) so running clients can poll for a newer deploy
  # and prompt a refresh (see checkAppVersion()). Static files are copied across.
  command = "node build.js"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions/sb.js,server.js"

# Serve the PWA manifest with its proper MIME type (Netlify defaults .webmanifest
# to application/octet-stream, which some browsers reject for install).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
